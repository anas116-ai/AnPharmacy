<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    AnPharmacy OS app icon (window / taskbar / tray source).
    Deep-navy rounded tile + the bold 'an' letterforms in the bright on-dark
    gradient. (OS app icons carry a background by convention — the logo itself
    ships box-free in logo-icon.svg / favicon-icon.svg.)
  -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="55%" stop-color="#0E1728"/>
      <stop offset="100%" stop-color="#101E38"/>
    </linearGradient>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="4" y1="53" x2="96" y2="53">
      <stop offset="0%" stop-color="#C026D3"/>
      <stop offset="40%" stop-color="#E879F9"/>
      <stop offset="75%" stop-color="#F9A8D4"/>
      <stop offset="100%" stop-color="#FDA4AF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="30" y="30" width="452" height="452" rx="86" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
  <g transform="translate(81 75.8) scale(3.5)">
    <circle cx="25" cy="53" r="14" fill="none" stroke="url(#g)" stroke-width="14"/>
    <path d="M42 30 L42 74" fill="none" stroke="url(#g)" stroke-width="14" stroke-linecap="round"/>
    <path d="M60 74 L60 37 C60 30 66 29 74.5 29 C83 29 89 31 89 37 L89 74"
          fill="none" stroke="url(#g)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
