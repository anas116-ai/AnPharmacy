<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64">
  <!--
    LOGO — "The An-Wordmark" horizontal application-header version
    (compact, transparent background). Slim lockup for app headers/titlebars.
  -->
  <defs>
    <linearGradient id="apMarkGrad" gradientUnits="userSpaceOnUse" x1="4" y1="53" x2="96" y2="53">
      <stop offset="0%" stop-color="#123F3D"/>
      <stop offset="40%" stop-color="#17827A"/>
      <stop offset="75%" stop-color="#3FA79B"/>
      <stop offset="100%" stop-color="#2E9C90"/>
    </linearGradient>
    <linearGradient id="apWordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#123F3D"/>
      <stop offset="45%" stop-color="#17827A"/>
      <stop offset="75%" stop-color="#3FA79B"/>
      <stop offset="100%" stop-color="#2E9C90"/>
    </linearGradient>
  </defs>

  <!-- Icon (slimmer) -->
  <g transform="translate(6,9) scale(0.52)">
    <circle cx="25" cy="53" r="14" fill="none" stroke="url(#apMarkGrad)" stroke-width="14"/>
    <path d="M42 30 L42 74" fill="none" stroke="url(#apMarkGrad)" stroke-width="14" stroke-linecap="round"/>
    <path d="M60 74 L60 37 C60 30 66 29 74.5 29 C83 29 89 31 89 37 L89 74"
          fill="none" stroke="url(#apMarkGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark: An = Sansation Bold (brand gradient) · Pharmacy = Sansation Light 300 (navy) -->
  <text
    x="60" y="44"
    font-family="'Sansation', 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif"
    font-size="30"
    letter-spacing="-0.3"
  >
    <tspan fill="url(#apWordGrad)" font-weight="700">An</tspan>
    <tspan fill="#14292E" font-weight="300">Pharmacy</tspan>
  </text>
</svg>
