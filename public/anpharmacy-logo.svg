<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 150" width="470" height="150" role="img" aria-label="AnPharmacy">
  <defs>
    <linearGradient id="sym" gradientUnits="userSpaceOnUse" x1="12" y1="32" x2="112" y2="122">
      <stop offset="0%" stop-color="#990066"/>
      <stop offset="52%" stop-color="#D4148C"/>
      <stop offset="100%" stop-color="#FF5A8D"/>
    </linearGradient>
    <linearGradient id="an" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#990066"/>
      <stop offset="48%" stop-color="#D4148C"/>
      <stop offset="100%" stop-color="#FF5A8D"/>
    </linearGradient>
  </defs>

  <!-- SYMBOL: Distribution Hub glyph (two sources -> one controlled node) -->
  <g transform="translate(12,30)" fill="url(#sym)" stroke="url(#sym)" stroke-width="8" stroke-linecap="round">
    <path d="M30,30 L50,72"/>
    <path d="M70,30 L50,72"/>
    <circle cx="30" cy="30" r="9"/>
    <circle cx="70" cy="30" r="9"/>
    <circle cx="50" cy="72" r="13" fill="none" stroke-width="8"/>
    <circle cx="50" cy="72" r="5"/>
  </g>

  <!-- WORDMARK -->
  <text x="128" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
    <tspan fill="url(#an)">An</tspan><tspan fill="#0A0A0A" font-weight="300">Pharmacy</tspan>
  </text>

  <!-- TAGLINE -->
  <text x="130" y="112" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="3.5" fill="#8A7E90">EVERY MEDICINE. UNDER CONTROL.</text>
</svg>
