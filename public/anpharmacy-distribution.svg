<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 150" width="470" height="150" role="img" aria-label="AnPharmacy">
  <defs>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#990066"/>
      <stop offset="100%" stop-color="#FF5A8D"/>
    </linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="50" y1="79" x2="96" y2="79">
      <stop offset="0%" stop-color="#D4148C"/>
      <stop offset="100%" stop-color="#FF5A8D"/>
    </linearGradient>
    <linearGradient id="an" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#990066"/>
      <stop offset="48%" stop-color="#D4148C"/>
      <stop offset="100%" stop-color="#FF5A8D"/>
    </linearGradient>
  </defs>

  <!-- TRANSFER symbol -->
  <g transform="translate(12,25)">
    <rect x="18" y="34" width="15" height="40" rx="7.5" fill="url(#pill)"/>
    <path d="M38,54 H62" stroke="url(#flow)" stroke-width="7" stroke-linecap="round"/>
    <path d="M60,46 L74,54 L60,62 Z" fill="url(#flow)"/>
    <circle cx="84" cy="54" r="11" fill="none" stroke="url(#flow)" stroke-width="7"/>
    <circle cx="84" cy="54" r="4" fill="url(#flow)"/>
  </g>

  <!-- WORDMARK -->
  <text x="128" y="86" font-family="'Space Grotesk','Manrope',sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
    <tspan fill="url(#an)">An</tspan><tspan fill="#0A0A0A" font-weight="300">Pharmacy</tspan>
  </text>

  <text x="130" y="112" font-family="'Space Grotesk','Manrope',sans-serif" font-size="13" font-weight="600" letter-spacing="3.5" fill="#8A7E90">EVERY MEDICINE. UNDER CONTROL.</text>
</svg>
