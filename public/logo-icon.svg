<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    LOGO — "The An-Wordmark" (icon only, TRANSPARENT background — no box)
    Two chunky bold lowercase letterforms, 'a' and 'n', drawn as thick uniform
    strokes — the letters themselves ARE the icon. No extra text, no numbers.
    Gradient flows across the letters from left to right: deep violet-magenta
    #A21CAF → rich magenta #D946EF → light pink #F472B6 → coral-red #FB7185.
  -->
  <defs>
    <linearGradient id="apMarkGrad" gradientUnits="userSpaceOnUse" x1="4" y1="53" x2="96" y2="53">
      <stop offset="0%" stop-color="#A21CAF"/>
      <stop offset="40%" stop-color="#D946EF"/>
      <stop offset="75%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
  </defs>
  <!-- 'a' bowl -->
  <circle cx="25" cy="53" r="14" fill="none" stroke="url(#apMarkGrad)" stroke-width="14"/>
  <!-- 'a' stem -->
  <path d="M42 30 L42 74" fill="none" stroke="url(#apMarkGrad)" stroke-width="14" stroke-linecap="round"/>
  <!-- 'n' -->
  <path d="M60 74 L60 37 C60 30 66 29 74.5 29 C83 29 89 31 89 37 L89 74"
        fill="none" stroke="url(#apMarkGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
