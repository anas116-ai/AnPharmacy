<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="AnPharmacy">
  <defs>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="14" y1="14" x2="86" y2="86">
      <stop offset="0%" stop-color="#123F3D"/>
      <stop offset="52%" stop-color="#17827A"/>
      <stop offset="100%" stop-color="#3FA79B"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17827A"/>
      <stop offset="100%" stop-color="#3FA79B"/>
    </linearGradient>
  </defs>
  <!-- three medicine streams converging into one controlled capsule -->
  <g fill="none" stroke="url(#flow)" stroke-width="6" stroke-linecap="round">
    <path d="M22,20 Q31,40 46,47"/>
    <path d="M50,13 Q50,30 50,47"/>
    <path d="M78,20 Q69,40 54,47"/>
  </g>
  <g fill="url(#flow)">
    <circle cx="22" cy="20" r="4.5"/>
    <circle cx="50" cy="13" r="4.5"/>
    <circle cx="78" cy="20" r="4.5"/>
  </g>
  <rect x="42" y="47" width="16" height="36" rx="8" fill="url(#pill)"/>
</svg>
