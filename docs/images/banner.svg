<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- Brand Gradients matching src/lib/Logo.tsx Concept #44 -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123F3D"/>
      <stop offset="52%" stop-color="#17827A"/>
      <stop offset="100%" stop-color="#3FA79B"/>
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="40%">
      <stop offset="0%" stop-color="#2E9C90"/>
      <stop offset="55%" stop-color="#17827A"/>
      <stop offset="100%" stop-color="#123F3D"/>
    </linearGradient>

    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123F3D"/>
      <stop offset="50%" stop-color="#0F262B"/>
      <stop offset="100%" stop-color="#0C1D21"/>
    </linearGradient>

    <!-- Subtle White Luxury Background Glow -->
    <radialGradient id="subtleGlow" cx="20%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#17827A" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#3FA79B" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Jewel Tile -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F262B" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Clean Luxury White Container -->
  <rect width="1200" height="340" rx="28" fill="#FFFFFF"/>
  <rect width="1200" height="340" rx="28" fill="url(#subtleGlow)"/>
  <rect width="1198" height="338" x="1" y="1" rx="27" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Top Accent Highlight -->
  <line x1="80" y1="2" x2="1120" y2="2" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <!-- OFFICIAL BRAND EMBLEM (Concept #44 Jewel Tile) -->
  <g transform="translate(90, 70)">
    <!-- Tile Background -->
    <rect width="144" height="144" rx="30" fill="url(#tileGrad)" filter="url(#tileShadow)"/>
    <rect width="142" height="142" x="1" y="1" rx="29" fill="none" stroke="#2E9C90" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Scaled Concept #44 Vector (Origin at 72, 66 with scale ~0.46) -->
    <g transform="translate(72, 66) scale(0.46)">
      <!-- Outer Continuous Arc -->
      <path
        d="M 60 -60 A 88 88 0 1 0 -72 50 C -64 72 -35 96 25 96 C 68 96 100 78 110 66 C 75 74 38 65 -10 45 C -45 32 -68 36 -72 50"
        fill="none"
        stroke="url(#brandGrad)"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Sculpted Botanical Leaf -->
      <path
        d="M -70 50 C -45 82 15 96 110 66 C 68 70 25 60 -18 40 C -48 26 -66 36 -70 50 Z"
        fill="url(#leafGrad)"
      />

      <!-- Leaf Vein -->
      <path
        d="M -58 52 Q 18 74 98 68"
        fill="none"
        stroke="#0C1D21"
        stroke-width="2.5"
        stroke-linecap="round"
      />

      <!-- Inner Monogram AP -->
      <g transform="translate(-12, -8)">
        <!-- A -->
        <path
          d="M -36 28 L -10 -40 L 16 28"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <!-- Chevron Crossbar -->
        <path
          d="M -22 6 L -10 -5 L 6 6"
          fill="none"
          stroke="#2E9C90"
          stroke-width="6.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <!-- P -->
        <path
          d="M 22 28 L 22 -40 L 48 -40 C 66 -40 78 -29 78 -14 C 78 2 66 12 48 12 L 22 12"
          fill="none"
          stroke="url(#brandGrad)"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </g>
    </g>
  </g>

  <!-- BRAND WORDMARK & METADATA -->
  <g transform="translate(280, 105)">
    <!-- Wordmark -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Inter, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" letter-spacing="-1">
      <tspan fill="#123F3D">An</tspan><tspan fill="#0F172A" font-weight="700">Pharmacy</tspan>
    </text>

    <!-- Tagline -->
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Inter, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="3.5" fill="#17827A">
      INTELLIGENT PHARMACY DISTRIBUTION MANAGEMENT
    </text>

    <!-- Subtitle -->
    <text y="74" font-family="-apple-system, BlinkMacSystemFont, Inter, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#64748B">
      Offline-First Desktop ERP • Automated FEFO Batch Allocation • GST Point of Sale • OCR Invoicing
    </text>

    <!-- Light Theme Feature Badges -->
    <g transform="translate(0, 102)">
      <!-- Badge 1: 100% Offline SQLite -->
      <g>
        <rect x="0" y="0" width="162" height="32" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
        <circle cx="16" cy="16" r="4.5" fill="#059669"/>
        <text x="30" y="21" font-family="sans-serif" font-size="12" font-weight="700" fill="#065F46">100% Offline SQLite</text>
      </g>

      <!-- Badge 2: FEFO Batch Engine -->
      <g transform="translate(174, 0)">
        <rect x="0" y="0" width="156" height="32" rx="10" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
        <circle cx="16" cy="16" r="4.5" fill="#0D9488"/>
        <text x="30" y="21" font-family="sans-serif" font-size="12" font-weight="700" fill="#115E59">FEFO Batch Engine</text>
      </g>

      <!-- Badge 3: OCR Invoice Intake -->
      <g transform="translate(342, 0)">
        <rect x="0" y="0" width="156" height="32" rx="10" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
        <circle cx="16" cy="16" r="4.5" fill="#7C3AED"/>
        <text x="30" y="21" font-family="sans-serif" font-size="12" font-weight="700" fill="#5B21B6">OCR Invoice Intake</text>
      </g>

      <!-- Badge 4: GST-Ready POS -->
      <g transform="translate(510, 0)">
        <rect x="0" y="0" width="144" height="32" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
        <circle cx="16" cy="16" r="4.5" fill="#2563EB"/>
        <text x="30" y="21" font-family="sans-serif" font-size="12" font-weight="700" fill="#1E40AF">GST-Ready POS</text>
      </g>

      <!-- Badge 5: Hardware-Locked License -->
      <g transform="translate(666, 0)">
        <rect x="0" y="0" width="186" height="32" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
        <circle cx="16" cy="16" r="4.5" fill="#D97706"/>
        <text x="30" y="21" font-family="sans-serif" font-size="12" font-weight="700" fill="#92400E">Hardware-Bound HWID</text>
      </g>
    </g>
  </g>
</svg>
