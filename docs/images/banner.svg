<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061214"/>
      <stop offset="50%" stop-color="#0A1F21"/>
      <stop offset="100%" stop-color="#0F2D30"/>
    </linearGradient>

    <!-- Brand Emblem Gradient -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="45%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Radial Background Glow -->
    <radialGradient id="radialGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0D9488" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container Box -->
  <rect width="1200" height="340" rx="28" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="28" fill="url(#radialGlow)"/>
  <rect width="1198" height="338" x="1" y="1" rx="27" fill="none" stroke="#10B981" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Decorative Top Hairline -->
  <line x1="80" y1="2" x2="1120" y2="2" stroke="url(#emblemGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- BRAND EMBLEM (Left / Centered vertically) -->
  <g transform="translate(110, 75)">
    <!-- Ambient Ring -->
    <circle cx="95" cy="95" r="92" fill="#10B981" fill-opacity="0.04" stroke="#10B981" stroke-opacity="0.12" stroke-width="2"/>
    <circle cx="95" cy="95" r="76" fill="#0D9488" fill-opacity="0.08" stroke="#0D9488" stroke-opacity="0.2" stroke-width="2"/>

    <!-- Geometric Medical Cross & Distribution Nodes -->
    <g transform="translate(45, 45)" stroke="url(#emblemGrad)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Cross Bar Horizontal -->
      <rect x="18" y="38" width="64" height="24" rx="8" fill="url(#emblemGrad)" stroke="none"/>
      <!-- Cross Bar Vertical -->
      <rect x="38" y="18" width="24" height="64" rx="8" fill="url(#emblemGrad)" stroke="none"/>
      <!-- Inner Pulse Core -->
      <circle cx="50" cy="50" r="7" fill="#FFFFFF"/>
      <!-- Orbiting Connection Nodes -->
      <circle cx="20" cy="20" r="5" fill="#38BDF8"/>
      <circle cx="80" cy="20" r="5" fill="#38BDF8"/>
      <circle cx="20" cy="80" r="5" fill="#38BDF8"/>
      <circle cx="80" cy="80" r="5" fill="#38BDF8"/>
      <path d="M25,25 L38,38 M75,25 L62,38 M25,75 L38,62 M75,75 L62,62" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="3 3"/>
    </g>
  </g>

  <!-- BRAND WORDMARK & TITLES -->
  <g transform="translate(350, 115)">
    <!-- Main Title -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">
      <tspan fill="url(#emblemGrad)">An</tspan><tspan fill="#FFFFFF" font-weight="400">Pharmacy</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#38BDF8">
      ENTERPRISE MEDICAL DISTRIBUTION &amp; PHARMACY ERP
    </text>

    <!-- Description -->
    <text y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94A3B8">
      Offline-First • Local SQLite Architecture • Automated FEFO Batch Allocation • OCR Invoicing
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 112)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="160" height="30" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.35"/>
      <circle cx="14" cy="15" r="4" fill="#10B981"/>
      <text x="26" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#34D399">100% Offline SQLite</text>

      <!-- Badge 2 -->
      <rect x="172" y="0" width="145" height="30" rx="8" fill="#0EA5E9" fill-opacity="0.15" stroke="#0EA5E9" stroke-opacity="0.35"/>
      <circle cx="186" cy="15" r="4" fill="#0EA5E9"/>
      <text x="198" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#38BDF8">FEFO Batch Engine</text>

      <!-- Badge 3 -->
      <rect x="329" y="0" width="150" height="30" rx="8" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-opacity="0.35"/>
      <circle cx="343" cy="15" r="4" fill="#8B5CF6"/>
      <text x="355" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#A78BFA">OCR Invoice Intake</text>

      <!-- Badge 4 -->
      <rect x="491" y="0" width="140" height="30" rx="8" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-opacity="0.35"/>
      <circle cx="505" cy="15" r="4" fill="#F59E0B"/>
      <text x="517" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#FBBF24">GST-Ready Billing</text>
    </g>
  </g>
</svg>
